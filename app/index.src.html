<title>Collegium Alexandrinum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one reading column like a lecture-hall lectern, crest masthead, a bottom bar of three rooms. Dark-first, from the crest. */
:root{
  --ink:#04101A; --raised:#0A1B29; --sunk:#071521; --line:#1C2E40;
  --gold:#D2A05A; --gold-hi:#F0D296; --gold-lo:#8A6A32; --on-gold:#04101A;
  --text:#EDE3CC; --muted:#A99C80; --ok:#86B98F; --bad:#DE8A72;
  --display:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;
  --body:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --ink:#F3ECDD; --raised:#FBF7EE; --sunk:#EAE1CE; --line:#D9CBAE;
  --gold:#8A5F22; --gold-hi:#6A4612; --gold-lo:#B98A45; --on-gold:#FBF7EE;
  --text:#14202C; --muted:#5F5848; --ok:#2E6A3B; --bad:#A3412A; color-scheme:light; } }
:root[data-theme="light"]{
  --ink:#F3ECDD; --raised:#FBF7EE; --sunk:#EAE1CE; --line:#D9CBAE;
  --gold:#8A5F22; --gold-hi:#6A4612; --gold-lo:#B98A45; --on-gold:#FBF7EE;
  --text:#14202C; --muted:#5F5848; --ok:#2E6A3B; --bad:#A3412A; color-scheme:light; }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:19px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:720px;margin:0 auto}
a{color:var(--gold-hi)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-wrap:balance;margin:0;color:var(--gold-hi)}
h1{font-size:1.65rem;line-height:1.2}
h2{font-size:1.2rem;line-height:1.3}
h3{font-size:1rem;letter-spacing:.1em}
p{margin:0}
.eyebrow{font-family:var(--display);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rule{border:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo),transparent);margin:6px 0}
.diamond{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:.7rem}
.diamond::before,.diamond::after{content:"";flex:1;height:1px;background:var(--gold-lo)}

.mast{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding-block:18px 10px}
.mast img{width:88px;height:62px;object-fit:cover;border:1px solid var(--gold-lo);border-radius:2px}
.mast .name{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.1em;color:var(--gold-hi);line-height:1.15}
.mast .motto{font-family:var(--display);font-size:.62rem;letter-spacing:.26em;color:var(--gold);margin-top:4px}

.panel{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.seal{border-color:var(--gold-lo);background:linear-gradient(180deg,var(--raised),var(--sunk))}
.agent{display:inline-flex;gap:8px;align-items:baseline;font-family:var(--display);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.agent b{color:var(--gold-hi);font-weight:700}

button{font:inherit;cursor:pointer}
.btn{font-family:var(--display);font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  padding:12px 18px;min-height:46px;border-radius:3px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold)}
.btn:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{background:transparent;color:var(--gold-hi)}
.btn.ghost:hover{background:var(--sunk)}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.choice:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,.nav button:focus-visible,.lrow:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
textarea,input[type=text],select{width:100%;font-family:var(--body);font-size:1.05rem;color:var(--text);background:var(--sunk);
  border:1px solid var(--line);border-radius:3px;padding:12px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
label{font-family:var(--display);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}

.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:12px 14px;border-radius:4px;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.msg.them{background:var(--raised);border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--sunk);border:1px solid var(--gold-lo);align-self:flex-end}
.thinking{font-style:italic;color:var(--muted)}
.quill{display:flex;align-items:center;gap:12px;font-style:italic;color:var(--muted);padding:6px 0}
.quill svg{width:36px;height:36px;color:var(--gold);flex:none}
@media (prefers-reduced-motion: no-preference){
  .quill .pen{animation:quill 1.4s ease-in-out infinite;transform-origin:8px 30px}
  .quill .ink{stroke-dasharray:22;animation:ink 1.4s linear infinite}
  .quill .dots i{animation:dot 1.4s infinite;font-style:normal}
  .quill .dots i:nth-child(2){animation-delay:.2s} .quill .dots i:nth-child(3){animation-delay:.4s}
  @keyframes quill{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(5px) rotate(-6deg)}}
  @keyframes ink{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
  @keyframes dot{0%,100%{opacity:.2}40%{opacity:1}}
}

.chip{display:inline-block;font-family:var(--ui);font-size:.72rem;letter-spacing:.04em;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.gold{border-color:var(--gold-lo);color:var(--gold-hi)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--bad);color:var(--bad)}

/* map path */
.path{display:flex;flex-direction:column}
.block{display:grid;grid-template-columns:52px 1fr;gap:14px}
.block .num{display:flex;flex-direction:column;align-items:center}
.block .num span{font-family:var(--display);font-weight:700;color:var(--gold-hi);width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--gold-lo);border-radius:50%;background:var(--raised);font-size:.85rem}
.block .num i{flex:1;width:1px;background:var(--gold-lo);min-height:18px}
.block:last-child .num i{visibility:hidden}
.block .body{padding-bottom:22px;min-width:0;display:flex;flex-direction:column;gap:6px}
.block[data-status="locked"] .num span{color:var(--muted);border-color:var(--line)}
.block[data-status="locked"] .body{opacity:.6}
.block[data-status="passed"] .num span{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:4px}
.lrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;padding:10px 0;width:100%}
.lrow .mk{width:22px;height:22px;transform:rotate(45deg);border:1px solid var(--gold-lo);justify-self:center}
.lrow[data-st="passed"] .mk{background:var(--gold);border-color:var(--gold)}
.lrow[data-st="reading"] .mk,.lrow[data-st="read"] .mk{background:linear-gradient(135deg,var(--gold) 50%,transparent 50%)}
.lrow:disabled{opacity:.55;cursor:default}
.lrow .t{min-width:0}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:12px;color:inherit}
.choice:hover{border-color:var(--gold)}
.choice[aria-pressed="true"]{border-color:var(--gold);background:var(--raised)}

/* reading */
.prose{min-width:0;overflow-wrap:anywhere}
.prose > *{margin:0 0 .8em}
.prose > *:last-child{margin-bottom:0}
.prose h1,.prose h2,.prose h3,.prose h4{font-family:var(--display);color:var(--gold-hi);font-size:1rem;letter-spacing:.08em}
.prose code{font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:var(--sunk);padding:1px 5px;border-radius:3px}
.prose pre{overflow-x:auto;background:var(--sunk);padding:12px;border-radius:3px}
.prose pre code{background:none;padding:0}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin-bottom:.3em}
.prose blockquote{border-left:2px solid var(--gold-lo);margin-left:0;padding-left:12px;color:var(--muted)}
.prose table{border-collapse:collapse;display:block;overflow-x:auto}
.prose td,.prose th{border:1px solid var(--line);padding:4px 8px}
.progress{display:flex;gap:4px}
.progress button{flex:1;height:6px;border:0;border-radius:3px;background:var(--line);padding:0;min-width:0}
.progress button.on{background:var(--gold)}
.progress button.here{background:var(--gold-hi)}
.diagram{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:14px;overflow-x:auto;text-align:center;min-height:60px}
.diagram svg{max-width:100%;height:auto}
.diagram .wait{font-style:italic;color:var(--muted);font-size:.9rem}
.check{border:1px solid var(--gold-lo);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.deeper{border-left:2px solid var(--gold);padding-left:14px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-family:var(--display);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.sources li{margin-bottom:6px}
.secnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ladder{display:flex;gap:6px}
.rung{flex:1;text-align:center;font-family:var(--display);font-size:.72rem;letter-spacing:.12em;padding:6px 0;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
.rung.on{border-color:var(--gold);color:var(--on-gold);background:var(--gold)}
.feedback{border-left:3px solid var(--gold-lo);padding-left:12px}
.feedback.ok{border-color:var(--ok)}
.feedback.bad{border-color:var(--bad)}

.card{min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:26px 20px;border:1px solid var(--gold-lo);border-radius:4px;background:var(--raised);
  background-image:radial-gradient(circle at 50% 0,rgba(210,160,90,.08),transparent 60%)}
.card .front{font-size:1.25rem;line-height:1.4}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{padding:10px 4px;font-size:.7rem;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades .btn small{font-family:var(--ui);letter-spacing:0;text-transform:none;font-weight:400;opacity:.8}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.6rem;color:var(--gold-hi);font-variant-numeric:tabular-nums}

.notice{padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:var(--sunk);font-size:.95rem}
.notice.warn{border-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--raised);border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:3px;z-index:20;max-width:calc(100% - 32px);font-size:.95rem}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sunk);border-top:1px solid var(--gold-lo);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{background:none;border:0;color:var(--muted);font-family:var(--display);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;padding:14px 4px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button[aria-current="page"]{color:var(--gold-hi)}
.nav button[aria-current="page"]::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--gold)}
.nav .count{font-family:var(--ui);font-size:.7rem;letter-spacing:0;color:var(--gold)}
.foot{text-align:center;padding-block:28px 8px;display:flex;flex-direction:column;gap:4px}
.foot .l{font-family:var(--display);font-size:.62rem;letter-spacing:.3em;color:var(--gold)}
.foot .e{font-size:.8rem;font-style:italic;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-family:var(--display);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--line);border-radius:2px;background:none;color:var(--muted)}
.tabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi)}
.list{display:flex;flex-direction:column}
.list > div{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
@media (prefers-reduced-motion: no-preference){ .fade{animation:fade .35s ease both} @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>

<!--AGENTS--><!--/AGENTS-->

<div class="wrap">
  <header class="mast">
    <img src="__CREST__" alt="Collegium Alexandrinum crest: a four-column temple under a gold arc">
    <div>
      <div class="name">Collegium Alexandrinum</div>
      <div class="motto">ALEXANDRIA &middot; SAPIENTIA &middot; HUMANITAS</div>
    </div>
  </header>
  <hr class="rule">
  <main id="main" class="stack" style="padding-block:18px 0"></main>
  <footer class="foot">
    <div class="l">SAPIENTIA SINE FINIBUS</div>
    <div class="e">Wisdom without boundaries</div>
    <div class="l" style="margin-top:10px">EX TENEBRIS AD LUCEM</div>
    <div class="e">From darkness to light</div>
  </footer>
</div>
<nav class="nav" aria-label="Rooms"><div class="in" id="nav"></div></nav>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
"use strict";
const APP_URL = "__APP_URL__";
const CAL = "Google Calendar";
const MERMAID_SRC = "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js";
const AGENTS = (() => { try { return JSON.parse(document.getElementById("agents").textContent); } catch (e) { return {}; } })();
const ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI"];
const TITLES = {
  assessor: ["Assessor", "finds your why and your level"],
  cartographer: ["Cartographer", "maps and writes the curriculum"],
  scholar: ["Scholar", "tutors"],
  proctor: ["Proctor", "examines"],
  registrar: ["Registrar", "keeps the record"],
  dialectician: ["Dialectician", "questions, never answers"],
  logician: ["Logician", "checks your reasoning"],
  auditor: ["Auditor", "hears you explain it back"],
  diagnostician: ["Diagnostician", "finds the root gap"],
  challenger: ["Challenger", "spars with you"],
};
const DEPTH = { crash: "Crash course", standard: "Standard", deep: "Deep dive" };

const S = {
  db: null, user: null, sample: null, mcp: null, downloads: null, uid: null,
  ready: false, school: null, courses: [], cards: [], blocks: {}, blockSubs: {}, lessons: {}, lessonSubs: {},
  view: "atrium", p: {}, busy: false, err: "", drafts: {}, stream: {}, reveal: {}, svg: {},
  exam: null, lq: null, review: null, regTab: "results", results: null, notes: null, usage: null, asked: {},
};

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function md(s) {
  s = String(s ?? "");
  let h;
  try { if (window.marked && window.DOMPurify) h = DOMPurify.sanitize(marked.parse(s)); } catch (e) {}
  if (h == null) h = esc(s).replace(/\n/g, "<br>");
  // Mermaid fences inside prose become diagram slots, drawn after render.
  return h.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, (m, src) => diagramSlot(unesc(src)));
}
const unesc = (s) => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
if (window.DOMPurify) DOMPurify.addHook("afterSanitizeAttributes", (n) => { if (n.tagName === "A") { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener"); } });
const pad = (n) => String(n).padStart(2, "0");
const today = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function addDays(ds, n) { const [y, m, d] = ds.split("-").map(Number); return today(new Date(y, m - 1, d + n)); }
function niceDate(ds) { const [y, m, d] = ds.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); }
const nowIso = () => new Date().toISOString();
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 28) || "course";
const byOrder = (a, b) => (a.order || 0) - (b.order || 0);
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 4200); }
function agentTag(k) { const t = TITLES[k] || [k, ""]; return `<span class="agent"><b>${esc(t[0])}</b> ${esc(t[1])}</span>`; }
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

/* ---------- diagrams (Mermaid, drawn by the page and cached) ---------- */
function diagramSlot(src) {
  src = String(src || "").trim(); if (!src) return "";
  const k = hash(src);
  if (S.svg[k]) return `<div class="diagram" role="img" aria-label="Diagram">${S.svg[k]}</div>`;
  return `<div class="diagram" data-k="${k}" data-src="${esc(src)}"><span class="wait">Drawing the diagram...</span></div>`;
}
let mermaidP = null;
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidP) return mermaidP;
  mermaidP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = MERMAID_SRC; s.onload = () => res(window.mermaid); s.onerror = rej; document.head.appendChild(s); })
    .then((m) => {
      const cs = getComputedStyle(document.documentElement); const v = (n) => cs.getPropertyValue(n).trim();
      m.initialize({ startOnLoad: false, securityLevel: "strict", theme: "base", fontFamily: "EB Garamond, Georgia, serif",
        themeVariables: { background: v("--sunk"), primaryColor: v("--raised"), primaryTextColor: v("--text"), primaryBorderColor: v("--gold"), lineColor: v("--gold"), secondaryColor: v("--sunk"), tertiaryColor: v("--ink"), textColor: v("--text"), noteBkgColor: v("--raised"), noteTextColor: v("--text"), fontSize: "15px" } });
      return m;
    });
  return mermaidP;
}
async function drawDiagrams() {
  const slots = [...document.querySelectorAll(".diagram[data-src]")];
  if (!slots.length) return;
  let m; try { m = await loadMermaid(); } catch (e) { slots.forEach((el) => fallbackDiagram(el)); return; }
  for (const el of slots) {
    const k = el.dataset.k, src = el.dataset.src;
    if (!S.svg[k]) { try { const r = await m.render("mm" + k + Math.random().toString(36).slice(2, 6), src); S.svg[k] = r.svg; } catch (e) { S.svg[k] = null; } }
    document.querySelectorAll(`.diagram[data-k="${k}"]`).forEach((n) => { if (S.svg[k]) { n.innerHTML = S.svg[k]; n.removeAttribute("data-src"); n.setAttribute("role", "img"); } else fallbackDiagram(n); });
  }
}
function fallbackDiagram(el) { el.innerHTML = `<details><summary>Diagram could not be drawn here. Show its outline</summary><pre style="text-align:left;white-space:pre-wrap;margin-top:8px">${esc(el.dataset.src || "")}</pre></details>`; el.removeAttribute("data-src"); }

/* ---------- data refs ---------- */
const root = () => S.db.doc(`data/users/${S.uid}/school`);
const col = (name) => root().collection(name);
const blocksCol = (cid) => col("courses").doc(cid).collection("blocks");
const lessonsCol = (cid, bid) => blocksCol(cid).doc(bid).collection("lessons");
const course = (cid) => S.courses.find((c) => c.id === cid);
const blockOf = (cid, bid) => (S.blocks[cid] || []).find((b) => b.id === bid);
const settings = () => Object.assign({ routing: "confirm", reminderHour: 8, reminders: true }, S.school?.settings || {});
const sortedBlocks = (cid) => (S.blocks[cid] || []).slice().sort(byOrder);

/* ---------- agents (Claude calls) ---------- */
function agentErr(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled") return "Claude is not allowed for this page. Open the page menu and allow Claude, then try again.";
  if (c === "rate_limited") return "Claude is busy or your usage limit is reached. Wait a little, then try again.";
  if (c === "invalid_json") return "The agent's answer came back garbled. Try again.";
  if (c === "session_expired") return "Your claude.ai session expired. Sign in again.";
  if (c === "prompt_too_large") return "That was too much text for one call. Try a shorter answer.";
  if (c === "cancelled") return "";
  return "The agent could not answer just now. Try again.";
}
function brief(agent, mode, data) {
  return `${AGENTS[agent] || ""}\n\n---\nMODE: ${mode}\nTODAY: ${today()}\n\nINPUT (JSON):\n${JSON.stringify(data, null, 1)}\n\nFollow the instructions for MODE "${mode}" exactly.`;
}
/* ---------- usage meter ---------- */
// The page's link to Claude reports no token counts, so each call is logged as an estimate:
// about 4 characters per token, thinking not included. One small doc per call in school/usage.
const NOT_SENT = ["not_granted", "sampling_disabled", "session_expired", "prompt_too_large", "rate_limited"];
const estTok = (s) => Math.ceil(String(s || "").length / 4);
function meter(agent, mode, input, out, tier, err) {
  if (!S.db || !S.uid) return;
  if (err && NOT_SENT.includes(err.code)) return;
  const inText = typeof input === "string" ? input : input.map((t) => t.content).join("\n");
  col("usage").add({ at: nowIso(), day: today(), agent, mode, cid: (S.p && S.p.cid) || null, tier: tier || "default",
    ok: !err, code: (err && err.code) || null, inTok: estTok(inText), outTok: estTok(out) }).catch(() => {});
  S.usage = null;
}
async function askJson(agent, mode, data, tier) {
  if (!S.sample) throw { code: "not_granted" };
  const input = brief(agent, mode, data);
  try {
    const r = await S.sample.json(input, { modelTier: tier || "default", cache: false });
    meter(agent, mode, input, JSON.stringify(r), tier); return r;
  } catch (e) { meter(agent, mode, input, e && e.text, tier, e || {}); throw e; }
}
// While an agent is writing: a small quill and dots, so the student knows it is working.
const THINK = "Thinking...";
const quill = (who) => `<div class="quill" role="status"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="pen"><path d="M31 3C21 6 13 15 9 26l2 1c5-8 12-15 20-24z"/><path d="M31 3 8 30"/></g><path class="ink" d="M3 33q3-3 6 0t6 0 6 0"/></svg><span>${who} is writing<span class="dots"><i>.</i><i>.</i><i>.</i></span></span></div>`;
const out = (t, who = "The Scholar") => !t || t === THINK ? quill(who) : md(t);
async function streamTo(key, agent, mode, data, tier) {
  if (!S.sample) { S.stream[key] = agentErr({ code: "not_granted" }); render(); return; }
  S.busy = true; S.stream[key] = THINK; render();
  let ok = false;
  const input = brief(agent, mode, data);
  try {
    const r = await S.sample(input, { modelTier: tier || "default", cache: false,
      onText: ({ text }) => { S.stream[key] = text; const el = document.getElementById(`out-${key}`); if (el) { el.innerHTML = out(text); } } });
    ok = true; meter(agent, mode, input, r.text, r.modelTierApplied || tier);
  } catch (e) { S.stream[key] = (e && e.text) || agentErr(e); meter(agent, mode, input, e && e.text, tier, e || {}); }
  finally { S.busy = false; render(); }
  return ok;
}

  { id: "spar", v: 2, agent: "challenger", when: () => false, label: () => "Spar against your goal" },

];
function dean(c) {
  if (!c) { const r = RULES[0]; return r.when() ? { rule: r, label: r.label(), go: r.go() } : null; }
  const b = c.status === "live" ? curBlock(c.id) : null;
  const ll = b ? !!S.lessons[c.id + "/" + b.id] : false;
  const l = b && ll && !(b.options && !b.chosen) ? nextLesson(c.id, b) : null;
  for (const r of RULES) {
    if (r.v !== 1 || !r.go) continue;
    if (r.when(c, b, l, ll)) return { rule: r, label: r.label(c, b, l), go: r.go(c, b, l), cid: c.id };
  }

}

async function logRoute(s, how) {

    const snap = await ref.get();

}

/* ---------- navigation and subscriptions ---------- */
function go(view, p = {}) {
  S.view = view; S.p = p; S.err = "";
  if (view === "review") startReview();
  if (p.cid) watchBlocks(p.cid);
  if (p.cid && p.bid) watchLessons(p.cid, p.bid);
  if (view === "lesson" && p.lid) openLesson(p.cid, p.bid, p.lid);
  if (view === "registry") loadRegistry();
  render(); window.scrollTo(0, 0);
}
function watchBlocks(cid) {
  if (S.blockSubs[cid] || !S.db) return;
  S.blockSubs[cid] = blocksCol(cid).onSnapshot((snap) => {
    S.blocks[cid] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    const cb = curBlock(cid); if (cb) watchLessons(cid, cb.id);
    render();
  }, () => { delete S.blockSubs[cid]; });
}
function watchLessons(cid, bid) {
  const k = cid + "/" + bid;
  if (S.lessonSubs[k] || !S.db) return;
  S.lessonSubs[k] = lessonsCol(cid, bid).onSnapshot((snap) => {
    S.lessons[k] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (S.view === "lesson" && S.p.lid && S.p.bid === bid) {
      const l = lessonOf(cid, bid, S.p.lid);
      if (l && (S.p.sec == null || !l.status || l.status === "unread")) openLesson(cid, bid, S.p.lid);
    }
    render();
  }, () => { delete S.lessonSubs[k]; });
}
async function openLesson(cid, bid, lid) {
  const l = lessonOf(cid, bid, lid);
  if (l) { if (S.p.sec == null) S.p.sec = Math.min(l.progress || 0, Math.max(0, (l.sections || []).length - 1)); }
  if (l && (!l.status || l.status === "unread")) { try { await lessonsCol(cid, bid).doc(lid).update({ status: "reading", startedAt: nowIso() }); } catch (e) {} }
}

/* ---------- spaced repetition (simplified SM-2) ---------- */
function schedule(card, g) {
  let ease = card.ease || 2.5, iv = card.interval || 0;
  if (g === "again") { ease = Math.max(1.3, ease - 0.2); iv = 0; }
  else if (g === "hard") { ease = Math.max(1.3, ease - 0.15); iv = Math.max(1, Math.round(iv * 1.2)); }
  else if (g === "good") { iv = iv === 0 ? 1 : iv === 1 ? 3 : Math.round(iv * ease); }
  else if (g === "easy") { ease = Math.min(2.8, ease + 0.15); iv = iv === 0 ? 3 : Math.round(Math.max(iv, 1) * ease * 1.3); }
  iv = Math.min(iv, 365);
  return { ease: Math.round(ease * 100) / 100, interval: iv, due: addDays(today(), iv) };
}
function startReview() { S.review = { queue: dueCards().map((c) => c.id), shown: false, done: 0 }; }

/* ---------- reminders (Google Calendar) ---------- */
function calErr(e) {
  const c = e && e.code;
  if (c === "server_not_connected" || c === "server_not_found") return "Add Google Calendar in claude.ai Settings, Connectors, to get reminders.";
  if (c === "needs_reauth") return "Reconnect Google Calendar in claude.ai Settings, Connectors.";
  if (c === "not_in_manifest" || c === "approval_required" || c === "not_granted" || c === "blocked_by_policy") return "Calendar reminders are not allowed for this page. Allow Google Calendar in the page's permissions to turn them on.";
  if (c === "selection_required") return "Choose which Google Calendar to use when claude.ai asks, then try again.";
  if (c === "tool_error") return "Google Calendar refused the event: " + (e.message || "").slice(0, 120);
  return "The reminder could not be booked just now. Use Book my next reminder in the Registry to try again.";
}
async function scheduleReminder(quiet) {
  const st = settings();
  if (!st.reminders) return "";
  if (!S.mcp) return quiet ? "" : "Calendar is not available on this page.";
  const t = today(); const hour = st.reminderHour; const nowH = new Date().getHours();
  const cards = liveCards();
  const D = cards.map((c) => c.due).filter((d) => d && (d > t || (d === t && nowH < hour))).sort()[0];
  if (!D) return "";
  const count = cards.filter((c) => c.due <= D).length;
  const summary = `Collegium: ${count} card${count === 1 ? "" : "s"} due`;
  const description = `Ten minutes with your flash cards in the Collegium Alexandrinum.${APP_URL && !APP_URL.startsWith("__") ? " Open: " + APP_URL : ""}`;
  try {
    const ref = col("reminders").doc(D);
    const snap = await ref.get(); const prior = snap.exists ? snap.data() : null;
    if (prior && prior.eventId) {
      if (prior.count !== count) { await S.mcp.callTool(CAL, "update_event", { eventId: prior.eventId, summary, description }); await ref.set({ ...prior, count, at: nowIso() }); }
    } else {
      const r = await S.mcp.callTool(CAL, "create_event", { summary, description, startTime: `${D}T${pad(hour)}:00:00`, endTime: `${D}T${pad(hour)}:10:00`, overrideReminders: [{ method: "popup", minutes: 0 }], availability: "AVAILABILITY_FREE" });
      const p = r && r.payload; const eventId = (p && (p.id || p.eventId || (p.event && p.event.id))) || "";
      await ref.set({ eventId, count, at: nowIso() });
    }
    return `Reminder booked in Google Calendar for ${niceDate(D)} at ${pad(hour)}:00.`;
  } catch (e) { return calErr(e); }
}

async function createCourse(text) {
  await ensureSchool();
  const cid = `${slug(text)}-${Date.now().toString(36)}`;
  await col("courses").doc(cid).set({ title: text.length > 60 ? text.slice(0, 57) + "..." : text, request: text, status: "assessing", assessChat: [], createdAt: nowIso(), updatedAt: nowIso() });
  return cid;
}
async function assessTurn(cid, text) {
  const c = course(cid); if (!c) return;
  const chat = (c.assessChat || []).slice();
  if (text) chat.push({ role: "user", content: text });
  const opener = `${AGENTS.assessor || ""}\n\n---\nTODAY: ${today()}\nThe student's opening request: "${c.request}"\n${chat.length ? "Continue the interview." : "Begin the interview with your first question."} Reply with ONLY the JSON object from the output contract.`;
  S.busy = true; S.err = ""; S.pending = text ? { cid, text } : null; render();
  let input = opener, metered = false;
  try {
    const turns = chat.slice();
    if (turns.length && turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: "(Please continue.)" });
    input = turns.length ? [{ role: "user", content: opener }, ...turns] : opener;
    const r = await S.sample.json(input, { modelTier: "default", cache: false });
    meter("assessor", "interview", input, JSON.stringify(r), "default"); metered = true;
    if (!r || typeof r.say !== "string") throw { code: "invalid_json" };
    chat.push({ role: "assistant", content: JSON.stringify(r) });
    const upd = { assessChat: chat, updatedAt: nowIso() };

function recordExam(E, correct, feedback, given) {

function usageHtml() {
  const us = S.usage;

  if (us === "loading") return `<p class="muted">Loading usage...</p>`;
  if (!us.length) return `<p class="muted">No tutor calls logged in the last 30 days. Counting started 25 Oct 2026.</p>`;
  const k = (n) => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
  const sum = (rows) => rows.reduce((a, r) => (a.calls++, a.inTok += r.inTok || 0, a.outTok += r.outTok || 0, a), { calls: 0, inTok: 0, outTok: 0 });
  const group = (key) => { const m = {}; for (const r of us) (m[key(r)] = m[key(r)] || []).push(r); return Object.entries(m).map(([g, rows]) => [g, sum(rows)]); };
  const row = (label, t) => `<div><span>${label} <span class="muted small">${t.calls} call${t.calls === 1 ? "" : "s"}</span></span><span class="chip">${k(t.inTok + t.outTok)}</span></div>`;
  const all = sum(us), d = today(), td = sum(us.filter((r) => r.day === d)), days = new Set(us.map((r) => r.day)).size;

      Today ${k(td.inTok + td.outTok)}. Average ${k(Math.round((all.inTok + all.outTok) / all.calls))} a call, ${k(Math.round((all.inTok + all.outTok) / days))} a study day.${fails ? ` ${fails} failed call${fails === 1 ? "" : "s"} included.` : ""}</p></div>
    <h3 style="margin-top:1.2rem">By agent</h3><div class="list">${byAgent.map(([g, t]) => row(esc(TITLES[g] || g), t)).join("")}</div>
    <h3 style="margin-top:1.2rem">Biggest tasks</h3><div class="list">${byMode.map(([g, t]) => row(esc(g), t)).join("")}</div>
    <h3 style="margin-top:1.2rem">By day</h3><div class="list">${byDay.map(([g, t]) => row(esc(g), t)).join("")}</div>
    <p class="small muted">Estimates. Claude does not report exact counts to this page, so text is counted at about 4 characters a token. Thinking is not counted, so real use runs higher. Course builds on the desktop are tracked separately.</p>`;
}

  const k = e.target.dataset && e.target.dataset.actChange; if (!k) return;
  if (k === "set-routing") saveSetting("routing", e.target.value);
  if (k === "set-hour") saveSetting("reminderHour", Number(e.target.value));
  if (k === "set-rem") saveSetting("reminders", e.target.value === "on");
});

/* ---------- boot ---------- */
async function boot() {
  render();
  const C = window.claude;
  if (C && C.use) {
    const use = (n) => C.use(n).catch(() => null);
    [S.db, S.user, S.sample, S.mcp, S.downloads] = await Promise.all(["db", "user", "sample", "mcp", "downloads"].map(use));
    if (S.user) { try { S.uid = await S.user.id(); } catch (e) { S.uid = null; } }
  }
  S.ready = true;
  if (S.db && S.uid) {
    root().onSnapshot((d) => { S.school = d.exists ? d.data() : null; render(); }, () => {});
    col("courses").onSnapshot((snap) => {
      S.courses = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      for (const c of S.courses) if (c.status === "live" || c.status === "complete") watchBlocks(c.id);
      render();
    }, () => {});
    col("cards").onSnapshot((snap) => { S.cards = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
  }
  render();
}
boot();
</script>
